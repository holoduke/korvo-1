# The WTW (DucoBox Energy Comfort) in Home Assistant, with its own screen.
#
# Hardware: a "Cheap Yellow Display" ESP32-3248S035R (ESP32-WROOM-32, no
# PSRAM, 3.5" 480x320 ST7796 over SPI, resistive XPT2046 touch, CH340 USB
# serial), on the Duco's Connectivity header where the Duco Connectivity Board
# would sit. The Duco speaks UART at 57600 baud, 3.3 V, straight to the ESP
# (kokx/duco-analysis); the component is kokx's, not yet merged into ESPHome
# (esphome/esphome#7993). The Duco only answers when asked.
#
# Wiring (Duco header, kokx's numbering -> the board's serial connector P1,
# beside the USB-C): pin 0 GND -> GND, pin 1 5 V -> VIN (the Duco powers the
# board; leave USB out meanwhile), pins 8/9 -> P1's RX and TX. With the wires as
# they ended up, the ESP listens on GPIO1 and talks on GPIO3 (found by trying
# both ways round on 2026-10-11). P1 is UART0, so the board logs over Wi-Fi only.
# The Duco's 10 V pin is never connected.
#
# Built and flashed from the HA server with ESPHome's Docker image; secrets in
# esphome/secrets.yaml (gitignored). See esphome/README.md.
#
# The screen is a HUD: near-black with a faint grid, neon cyan and amber,
# Orbitron for figures (the wall panel's display face) and Rajdhani for
# labels. The main page: the airflow as a reactor ring (a light runs round it
# while air moves) with the stand under it, the heat exchanger as a live
# diagram — outside air in and on to the house in cyan, the house's air out and
# away in amber, crossing in the core, which shows the recovery efficiency —
# bypass and filter, and the stand to choose: AUTO · I · II · III. The gear
# opens the settings: continuous stands, a boost, away, the comfort
# temperature, the screen's brightness, touch calibration and the board's
# status. The touch is calibrated on the board itself (four crosses), kept
# across restarts; it starts by itself until it has been done once.
substitutions:
  bg: "0x05070A"
  panel: "0x0A1016"
  grid: "0x0E2A33"
  cyan: "0x00E5FF"
  cyan_dim: "0x0B3A44"
  ice: "0x7FF3FF"
  amber: "0xFFB547"
  amber_dim: "0x8A6428"
  text: "0xE6F7FF"
  dim: "0x5F7A86"
  green: "0x38F2A0"
  red: "0xFF4D6A"

esphome:
  name: wtw-duco
  friendly_name: WTW
  includes:
    - duco_extra.h # the box parameters the duco component does not read (fans, settings)
  on_boot:
    - priority: 600
      then:
        # the stored calibration, before the first touch is read
        - lambda: |-
            if (id(cal_version) != 2) id(cal_ok) = false;  // 2: median of firm presses
            if (id(cal_ok)) {
              id(touch).set_calibration(id(cal_x_min), id(cal_x_max), id(cal_y_min), id(cal_y_max));
              id(touch).set_swap_xy(id(cal_swap));
              id(touch).set_mirror_x(id(cal_mirror_x));
              id(touch).set_mirror_y(id(cal_mirror_y));
            }
    - priority: -100
      then:
        - lambda: |-
            auto *x = new DucoExtra();
            x->set_parent(id(duco_box));
            x->add(0x40, 0x09, [](int32_t v) { id(fan_sup_rpm).publish_state(v); });
            x->add(0x44, 0x09, [](int32_t v) { id(fan_eha_rpm).publish_state(v); });
            x->add(0x4D, 0x09, [](int32_t v) { id(fan_sup_level).publish_state(v); });
            x->add(0x4E, 0x09, [](int32_t v) { id(fan_eha_level).publish_state(v); });
            x->add(0x43, 0x09, [](int32_t v) { id(fan_sup_raw).publish_state(v); });
            x->add(0x47, 0x09, [](int32_t v) { id(fan_eha_raw).publish_state(v); });
            x->add(0x13, 0x0A, [](int32_t v) { id(comfort_temp).publish_state(v / 10.0f); });
            x->add(0x31, 0x0A, [](int32_t v) {
              const std::string o = std::to_string(v);
              if (id(filter_lifetime).has_option(o)) id(filter_lifetime).publish_state(o);
            });
            x->add_setting(0, [](int v, int, int) { id(auto_min).publish_state(v); });
            x->add_setting(1, [](int v, int, int) { id(auto_max).publish_state(v); });
            x->add_setting(2, [](int v, int, int) { id(flow_max).publish_state(v); });
            x->add_setting(6, [](int v, int, int) { id(stand_1).publish_state(v); });
            x->add_setting(7, [](int v, int, int) { id(stand_2).publish_state(v); });
            x->add_setting(8, [](int v, int, int) { id(stand_3).publish_state(v); });
            x->add_setting(9, [](int v, int, int) { id(boost_time).publish_state(v); });
            x->add(0x10, 0x0A, [](int32_t v) {
              static const char *const modes[] = {"Automatisch", "Dicht", "Open"};
              if (v >= 0 && v <= 2) id(bypass_mode).publish_state(modes[v]);
            });
            x->add(0x11, 0x0A, [](int32_t v) { id(bypass_adaptive).publish_state(v != 0); });
            x->add(0x01, 0x03, [](int32_t v) { id(nightboost).publish_state(v != 0); });
            x->add(0x02, 0x03, [](int32_t v) { id(nightboost_temp).publish_state(v); });
            x->add(0x03, 0x03, [](int32_t v) { id(nightboost_month_start).publish_state(v); });
            x->add(0x04, 0x03, [](int32_t v) { id(nightboost_month_stop).publish_state(v); });
            x->add(0x05, 0x03, [](int32_t v) { id(nightboost_from) = v; id(show_nightboost).execute(); });
            x->add(0x06, 0x03, [](int32_t v) { id(nightboost_to) = v; id(show_nightboost).execute(); });
            x->add(0x07, 0x03, [](int32_t v) { id(nightboost_max).publish_state(v); });
            x->add(0x01, 0x00, [](int32_t v) { id(temp_control).publish_state(v != 0); });
            x->add(0x02, 0x00, [](int32_t v) { id(temp_control_low).publish_state(v / 10.0f); });
            x->add(0x03, 0x00, [](int32_t v) { id(temp_control_high).publish_state(v / 10.0f); });
            x->on_version = [](const std::string &v) { id(duco_version).publish_state(v); };
            x->on_errors = [](const std::string &codes) {
              id(duco_errors).publish_state(codes.empty() ? std::string("Geen") : codes);
              id(show_status).execute();
            };
            duco_extra() = x;
        - script.execute: show_mode
        - script.execute: show_efficiency
        - light.turn_on:
            id: backlight
            brightness: !lambda "return id(brightness_pct) / 100.0f;"
        - lvgl.slider.update:
            id: bright_slider
            value: !lambda "return id(brightness_pct);"
        - if:
            condition:
              lambda: "return !id(cal_ok);"
            then:
              - delay: 3s
              - script.execute: calibration_start

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: WTW fallback
    password: !secret fallback_password

captive_portal:

logger:
  baud_rate: 0 # P1 (UART0) is the Duco's; logs go over Wi-Fi

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - lvgl.widget.update:
        id: link_dot
        bg_color: ${green}
    - lvgl.label.update:
        id: link_label
        text: "LINK"
        text_color: ${green}
  on_client_disconnected:
    - lvgl.widget.update:
        id: link_dot
        bg_color: ${red}
    - lvgl.label.update:
        id: link_label
        text: "OFFLINE"
        text_color: ${red}

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: nightboost_from # minutes of the day (box parameter 05/03)
    type: int
    initial_value: "-1"
  - id: nightboost_to # (06/03)
    type: int
    initial_value: "-1"
  # touch calibration (see calibration_finish); kept across restarts
  - { id: cal_ok, type: bool, restore_value: true, initial_value: "false" }
  # the calibration method's version: a calibration made by an older one is redone
  - { id: cal_version, type: int, restore_value: true, initial_value: "0" }
  - { id: cal_x_min, type: int, restore_value: true, initial_value: "300" }
  - { id: cal_x_max, type: int, restore_value: true, initial_value: "3800" }
  - { id: cal_y_min, type: int, restore_value: true, initial_value: "300" }
  - { id: cal_y_max, type: int, restore_value: true, initial_value: "3800" }
  - { id: cal_swap, type: bool, restore_value: true, initial_value: "false" }
  - { id: cal_mirror_x, type: bool, restore_value: true, initial_value: "false" }
  - { id: cal_mirror_y, type: bool, restore_value: true, initial_value: "false" }
  # the calibration under way: step 0..3, the raw readings at each cross
  - { id: cal_active, type: bool, restore_value: false, initial_value: "false" }
  - { id: cal_step, type: int, restore_value: false, initial_value: "0" }
  - { id: cal_raw, type: "std::array<int, 8>", restore_value: false }
  - { id: cal_samples_x, type: "std::vector<int>", restore_value: false }
  - { id: cal_last_ms, type: uint32_t, restore_value: false, initial_value: "0" }
  - { id: cal_samples_y, type: "std::vector<int>", restore_value: false }
  # the screen's brightness in use (the settings slider); dimmed it is half
  - { id: brightness_pct, type: int, restore_value: true, initial_value: "100" }

# ---- The Duco ----------------------------------------------------------------
external_components:
  - source: github://pr#7993
    components: [duco]
    # the PR moves on; keep the copy this board was built and tested with
    refresh: never

uart:
  id: duco_uart
  rx_pin: GPIO1 # P1, from the Duco's TX
  tx_pin: GPIO3 # P1, to the Duco's RX
  baud_rate: 57600
  rx_buffer_size: 256

duco:
  id: duco_box
  uart_id: duco_uart
  discovery: {} # logs the nodes it finds (the box, its sensors)

select:
  - platform: duco
    id: duco_mode
    name: Stand
    on_value:
      - script.execute: show_mode
  # how often the filter is due (box parameter 31/0A, days)
  - platform: template
    id: filter_lifetime
    name: Filter interval
    icon: mdi:air-filter
    entity_category: config
    options: ["90", "180", "270", "360"]
    optimistic: false
    lambda: "return {};" # no made-up option at boot: the box's answer sets it
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x31, 0x0A, atoi(x.c_str()));"
  # bypass (10/0A): automatic, closed (always heat recovery) or open (never)
  - platform: template
    id: bypass_mode
    name: Bypass stand
    icon: mdi:valve
    entity_category: config
    options: ["Automatisch", "Dicht", "Open"]
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: |-
          const int v = x == "Dicht" ? 1 : x == "Open" ? 2 : 0;
          if (duco_extra()) duco_extra()->write(0x10, 0x0A, v);

number:
  # the supply temperature target ("comfort"): box parameter 13/0A in °C x 10
  # (the duco component's 12/0A does not exist on this box)
  - platform: template
    id: comfort_temp
    name: Comforttemperatuur
    icon: mdi:thermometer-auto
    unit_of_measurement: "°C"
    min_value: 10
    max_value: 25.5
    step: 0.5
    optimistic: false
    lambda: "return {};" # no made-up value at boot: the box's answer sets it
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x13, 0x0A, (int32_t) lroundf(x * 10));"
    on_value:
      - lvgl.label.update:
          id: comfort_value
          text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'

  # the box's own settings (display SETTINGS > CONFIG > BOX, duco_extra.h):
  # the airflow per stand in % of the commissioned maximum, ranges as the box gives them
  - platform: template
    id: auto_min
    name: Auto minimum
    icon: mdi:fan-chevron-down
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write_setting(0, (int) x);"
  - platform: template
    id: auto_max
    name: Auto maximum
    icon: mdi:fan-chevron-up
    entity_category: config
    unit_of_measurement: "%"
    min_value: 30
    max_value: 100
    step: 5
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write_setting(1, (int) x);"
  - platform: template
    id: stand_1
    name: Stand I
    icon: mdi:fan-speed-1
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 50
    step: 5
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write_setting(6, (int) x);"
  - platform: template
    id: stand_2
    name: Stand II
    icon: mdi:fan-speed-2
    entity_category: config
    unit_of_measurement: "%"
    min_value: 15
    max_value: 100
    step: 5
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write_setting(7, (int) x);"
  - platform: template
    id: stand_3
    name: Stand III
    icon: mdi:fan-speed-3
    entity_category: config
    unit_of_measurement: "%"
    min_value: 50
    max_value: 100
    step: 5
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write_setting(8, (int) x);"

  # NightBoost (table 03): summer night cooling, off by default
  - platform: template
    id: nightboost_temp
    name: NightBoost vanaf
    icon: mdi:thermometer-chevron-up
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 60
    step: 1
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x02, 0x03, (int32_t) x);"
  - platform: template
    id: nightboost_month_start
    name: NightBoost eerste maand
    icon: mdi:calendar-start
    entity_category: config
    min_value: 1
    max_value: 12
    step: 1
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x03, 0x03, (int32_t) x);"
  - platform: template
    id: nightboost_month_stop
    name: NightBoost laatste maand
    icon: mdi:calendar-end
    entity_category: config
    min_value: 1
    max_value: 12
    step: 1
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x04, 0x03, (int32_t) x);"
  - platform: template
    id: nightboost_max
    name: NightBoost maximum
    icon: mdi:fan-chevron-up
    entity_category: config
    unit_of_measurement: "%"
    min_value: 10
    max_value: 100
    step: 5
    optimistic: false
    lambda: "return {};"
    update_interval: never
    set_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x07, 0x03, (int32_t) x);"

switch:
  # restore_mode DISABLED: a switch must never write to the box at boot
  - platform: template
    id: bypass_adaptive
    name: Bypass adaptief
    icon: mdi:thermometer-auto
    entity_category: config
    restore_mode: DISABLED
    optimistic: false
    lambda: "return {};"
    turn_on_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x11, 0x0A, 1);"
    turn_off_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x11, 0x0A, 0);"
  - platform: template
    id: nightboost
    name: NightBoost
    icon: mdi:weather-night
    entity_category: config
    restore_mode: DISABLED
    optimistic: false
    lambda: "return {};"
    turn_on_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x01, 0x03, 1);"
    turn_off_action:
      - lambda: "if (duco_extra()) duco_extra()->write(0x01, 0x03, 0);"

button:
  - platform: template
    name: Touch kalibreren
    icon: mdi:gesture-tap
    on_press:
      - script.execute: calibration_start
  - platform: restart
    name: Herstarten

sensor:
  - platform: duco
    # the Duco CO2 room sensor (UCCO2, node 2, added 2026-10-22): in AUTO the box
    # follows it, so a high flow in the evening is the CO2 rising
    co2:
      - address: 2
        id: co2_room
        name: CO2
    temperature:
      - address: 2
        name: Temperatuur CO2-sensor
    flow_level:
      id: flow
      name: Debiet
      on_value:
        - lvgl.arc.update:
            id: flow_arc
            value: !lambda "return isnan(x) ? 0 : (int) x;"
        - lvgl.label.update:
            id: flow_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%d", (int) x);'
        # the light round the ring runs while air moves
        - lvgl.widget.update:
            id: flow_spin
            hidden: !lambda "return isnan(x) || x < 1;"
    time_remaining:
      id: time_left
      name: Tijd resterend
      on_value:
        - script.execute: show_mode
    filter_remaining:
      id: filter_left
      name: Filter resterend
      on_value:
        - lvgl.label.update:
            id: filter_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%dD", (int) x);'
        - lvgl.bar.update:
            id: filter_bar
            value: !lambda "return isnan(x) ? 0 : std::min(180, (int) x);"
    bypass:
      id: bypass
      name: Bypass
      on_value:
        - lvgl.label.update:
            id: bypass_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%d%%", (int) x);'
        - lvgl.bar.update:
            id: bypass_bar
            value: !lambda "return isnan(x) ? 0 : (int) x;"
    temperature_oda:
      id: t_oda
      name: Buitenlucht
      on_value:
        - lvgl.label.update:
            id: oda_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
        - script.execute: show_efficiency
    temperature_sup:
      id: t_sup
      name: Toevoer
      on_value:
        - lvgl.label.update:
            id: sup_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
        - script.execute: show_efficiency
    temperature_eta:
      id: t_eta
      name: Afzuiging
      on_value:
        - lvgl.label.update:
            id: eta_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
        - script.execute: show_efficiency
    temperature_eha:
      id: t_eha
      name: Afvoer
      on_value:
        - lvgl.label.update:
            id: eha_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
  # the box's commissioned maximum flow and boost time (read only)
  - platform: template
    id: flow_max
    name: Maximaal debiet
    icon: mdi:weather-windy
    entity_category: diagnostic
    unit_of_measurement: "m³/h"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: boost_time
    name: Boosttijd
    icon: mdi:timer-outline
    entity_category: diagnostic
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: never
  # temperature-dependent control (table 00), read only
  - platform: template
    id: temp_control_low
    name: Temperatuurregeling onder
    icon: mdi:thermometer-low
    entity_category: diagnostic
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: temp_control_high
    name: Temperatuurregeling boven
    icon: mdi:thermometer-high
    entity_category: diagnostic
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never
  # the fans themselves (duco_extra.h): what the box really does, not what was asked
  - platform: template
    id: fan_sup_rpm
    name: Ventilator toevoer
    icon: mdi:fan
    unit_of_measurement: rpm
    accuracy_decimals: 0
    update_interval: never
    on_value:
      - script.execute: show_fans
  - platform: template
    id: fan_eha_rpm
    name: Ventilator afvoer
    icon: mdi:fan
    unit_of_measurement: rpm
    accuracy_decimals: 0
    update_interval: never
    on_value:
      - script.execute: show_fans
  - platform: template
    id: fan_sup_level
    name: Ventilatorniveau toevoer
    icon: mdi:speedometer
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
    on_value:
      - script.execute: show_fans
  - platform: template
    id: fan_eha_level
    name: Ventilatorniveau afvoer
    icon: mdi:speedometer
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: fan_sup_raw
    name: Toevoer meetwaarde
    icon: mdi:gauge
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: fan_eha_raw
    name: Afvoer meetwaarde
    icon: mdi:gauge
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: wifi_signal
    id: wifi_rssi
    name: Wifi-signaal
    update_interval: 60s
  - platform: uptime
    id: uptime_s
    name: Uptime
    update_interval: 60s
  # How much of the house's warmth the exchanger gives back to the air coming
  # in: (supply − outside) / (extract − outside). Meaningless when inside and
  # outside are about as warm, so then it says nothing.
  - platform: template
    id: efficiency
    name: Rendement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    id: temp_control
    name: Temperatuurregeling
    icon: mdi:thermometer-auto
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: duco_version
    name: Software
    icon: mdi:chip
    entity_category: diagnostic
  - platform: template
    id: nightboost_window
    name: NightBoost tijden
    icon: mdi:clock-outline
    entity_category: diagnostic
  # the box's error log: codes XX.YY.ZZ (Duco service sheet L2004550), or "Geen"
  - platform: template
    id: duco_errors
    name: Storing
    icon: mdi:alert-circle-outline
    entity_category: diagnostic
  - platform: duco
    id: duco_serial
    name: Serienummer
  - platform: wifi_info
    ip_address:
      id: wtw_ip
      name: IP-adres

script:
  - id: show_nightboost
    then:
      - lambda: |-
          const int a = id(nightboost_from), b = id(nightboost_to);
          if (a < 0 || b < 0) return;
          id(nightboost_window).publish_state(str_sprintf("%02d:%02d–%02d:%02d", a / 60, a % 60, b / 60, b % 60));
  # A tap on a stand: that button lights at once and the others go out, the
  # stand goes to the Duco, and until it answers the line under says so.
  - id: pick_stand
    mode: restart # a second tap within the wait takes over
    parameters:
      option: string
    then:
      - lvgl.widget.update: { id: btn_auto, state: { checked: !lambda 'return option == "AUTO";' } }
      - lvgl.widget.update: { id: btn_1, state: { checked: !lambda 'return option == "MAN1";' } }
      - lvgl.widget.update: { id: btn_2, state: { checked: !lambda 'return option == "MAN2";' } }
      - lvgl.widget.update: { id: btn_3, state: { checked: !lambda 'return option == "MAN3";' } }
      - lvgl.label.update:
          id: mode_sub
          text: "naar de Duco verstuurd…"
      - select.set:
          id: duco_mode
          option: !lambda "return option;"
      - delay: 8s
      # no answer: show what the Duco really runs
      - script.execute: show_mode

  # The stand in words, how long a temporary one still runs, which buttons are lit.
  - id: show_mode
    then:
      - lvgl.label.update:
          id: mode_label
          text: !lambda |-
            if (!id(duco_mode).has_state()) return std::string("STANDBY");
            const std::string m = id(duco_mode).current_option();
            if (m == "AUTO") return std::string("AUTOMATISCH");
            if (m == "EMPT") return std::string("AFWEZIG");
            if (m.size() >= 4 && m.rfind("CNT", 0) == 0) return "CONTINU " + std::string(m[3] == '1' ? "I" : m[3] == '2' ? "II" : "III");
            if (m.size() >= 4 && m.rfind("MAN", 0) == 0) {
              std::string s = "STAND " + std::string(m[3] == '1' ? "I" : m[3] == '2' ? "II" : "III");
              if (m.size() >= 6) s += m[5] == '2' ? " / 30 MIN" : " / 45 MIN";
              return s;
            }
            return m;
      - lvgl.label.update:
          id: mode_sub
          text: !lambda |-
            if (!id(duco_mode).has_state()) return std::string("wacht op de Duco");
            const std::string m = id(duco_mode).current_option();
            if (m == "AUTO") return std::string("op de sensoren en het schema");
            if (m == "EMPT") return std::string("minimale ventilatie");
            if (m.rfind("CNT", 0) == 0) return std::string("blijft aan tot je iets anders kiest");
            const float t = id(time_left).state;
            if (isnan(t) || t <= 0) return std::string("");
            const int s = (int) t;
            return s >= 3600 ? str_sprintf("nog %d:%02d uur, dan weer auto", s / 3600, (s % 3600) / 60)
                             : str_sprintf("nog %d:%02d min, dan weer auto", s / 60, s % 60);
      # main page: the four stands (a timed variant lights its level)
      - lvgl.widget.update:
          id: btn_auto
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "AUTO";'
      - lvgl.widget.update:
          id: btn_1
          state:
            checked: !lambda 'return id(duco_mode).has_state() && std::string(id(duco_mode).current_option()).rfind("MAN1", 0) == 0;'
      - lvgl.widget.update:
          id: btn_2
          state:
            checked: !lambda 'return id(duco_mode).has_state() && std::string(id(duco_mode).current_option()).rfind("MAN2", 0) == 0;'
      - lvgl.widget.update:
          id: btn_3
          state:
            checked: !lambda 'return id(duco_mode).has_state() && std::string(id(duco_mode).current_option()).rfind("MAN3", 0) == 0;'
      # settings page: continuous, boost, away
      - lvgl.widget.update:
          id: set_cnt1
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "CNT1";'
      - lvgl.widget.update:
          id: set_cnt2
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "CNT2";'
      - lvgl.widget.update:
          id: set_cnt3
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "CNT3";'
      - lvgl.widget.update:
          id: set_boost15
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "MAN3";'
      - lvgl.widget.update:
          id: set_boost30
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "MAN3x2";'
      - lvgl.widget.update:
          id: set_boost45
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "MAN3x3";'
      - lvgl.widget.update:
          id: set_away
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "EMPT";'

  # what the fans really do, beside what the stand asks
  - id: show_fans
    then:
      - lvgl.label.update:
          id: fan_label
          text: !lambda |-
            const float lvl = id(fan_sup_level).state, rpm = id(fan_sup_rpm).state;
            if (isnan(lvl) && isnan(rpm)) return std::string("VENTILATOREN --");
            return str_sprintf("VENTILATOREN %s · %s RPM", isnan(lvl) ? "--" : str_sprintf("%d%%", (int) lvl).c_str(),
                               isnan(rpm) ? "--" : str_sprintf("%d", (int) rpm).c_str());

  - id: show_efficiency
    then:
      - lambda: |-
          const float oda = id(t_oda).state, sup = id(t_sup).state, eta = id(t_eta).state;
          float eff = NAN;
          if (!isnan(oda) && !isnan(sup) && !isnan(eta) && fabsf(eta - oda) >= 3.0f)
            eff = std::max(0.0f, std::min(100.0f, (sup - oda) / (eta - oda) * 100.0f));
          if (isnan(eff) != isnan(id(efficiency).state) || (!isnan(eff) && fabsf(eff - id(efficiency).state) >= 1.0f))
            id(efficiency).publish_state(eff);
      - lvgl.label.update:
          id: eff_value
          text: !lambda 'const float e = id(efficiency).state; return isnan(e) ? std::string("--") : str_sprintf("%d%%", (int) e);'

  - id: show_status
    then:
      - lvgl.label.update:
          id: status_text
          text: !lambda |-
            const float rssi = id(wifi_rssi).state, up = id(uptime_s).state;
            const std::string ip = id(wtw_ip).has_state() ? id(wtw_ip).state : std::string("--");
            const std::string wifi = isnan(rssi) ? std::string("--") : str_sprintf("%d dBm", (int) rssi);
            const int u = isnan(up) ? 0 : (int) up;
            const float fs = id(fan_sup_rpm).state, fe = id(fan_eha_rpm).state;
            std::string err = id(duco_errors).has_state() ? id(duco_errors).state : std::string("--");
            if (err.find("43.23.01") != std::string::npos) err += " NIET INGEREGELD";
            return str_sprintf("IP %s   WIFI %s\nAAN %dd %dh %dm\nFANS %s / %s RPM\nSTORING %s", ip.c_str(), wifi.c_str(),
                               u / 86400, (u % 86400) / 3600, (u % 3600) / 60,
                               isnan(fs) ? "--" : str_sprintf("%d", (int) fs).c_str(),
                               isnan(fe) ? "--" : str_sprintf("%d", (int) fe).c_str(), err.c_str());

  # ---- touch calibration --------------------------------------------------------
  # Four crosses in the landscape screen's corners. ESPHome turns a raw reading
  # into a point on the panel's native portrait 320x480 (calibration, then
  # swap and mirror), and LVGL rotates that by 90°: landscape x = native y,
  # landscape y = 319 − native x. So each cross is where the native point
  # should be, and the raw readings at the crosses give, per native axis,
  # which raw axis it follows (swap), its range and its direction (mirror).
  - id: calibration_start
    mode: restart
    then:
      - lambda: |-
          id(touch).set_swap_xy(false);
          id(touch).set_mirror_x(false);
          id(touch).set_mirror_y(false);
          id(cal_step) = 0;
          id(cal_samples_x).clear();
          id(cal_samples_y).clear();
          id(cal_last_ms) = millis();
          id(cal_active) = true;
      - light.turn_on: { id: backlight, brightness: 100% }
      - lvgl.widget.update: { id: cal_cross, x: 26, y: 26 }
      - lvgl.label.update: { id: cal_hint, text: "TIK OP HET KRUIS  1/4" }
      - lvgl.page.show: cal_page
      # not finished in two minutes: back, with the old calibration
      - delay: 120s
      - if:
          condition:
            lambda: "return id(cal_active);"
          then:
            - lambda: |-
                id(cal_active) = false;
                if (id(cal_ok)) {
                  id(touch).set_swap_xy(id(cal_swap));
                  id(touch).set_mirror_x(id(cal_mirror_x));
                  id(touch).set_mirror_y(id(cal_mirror_y));
                }
            - lvgl.page.show: home_page

  # A press on a cross is over: its reading is the median of all the raw
  # readings during it (a stray one at the start or end does not count).
  - id: calibration_press
    then:
      - lambda: |-
          auto &xs = id(cal_samples_x);
          auto &ys = id(cal_samples_y);
          const size_t n = std::min(xs.size(), ys.size());
          if (!id(cal_active) || n < 3) {  // too short to trust: press again
            xs.clear(); ys.clear();
            return;
          }
          std::sort(xs.begin(), xs.begin() + n);
          std::sort(ys.begin(), ys.begin() + n);
          const int s = id(cal_step);
          const int mx = xs[n / 2], my = ys[n / 2];
          xs.clear(); ys.clear();
          // a second press right after the last (a double tap, a bounce) is not the next cross
          if (millis() - id(cal_last_ms) < 800) return;
          // nor is a press where the previous cross was: the crosses are far apart
          if (s > 0 && abs(mx - id(cal_raw)[(s - 1) * 2]) + abs(my - id(cal_raw)[(s - 1) * 2 + 1]) < 500) {
            ESP_LOGW("cal", "cross %d: raw %d,%d is where cross %d was, press the new cross", s + 1, mx, my, s);
            return;
          }
          id(cal_last_ms) = millis();
          id(cal_raw)[s * 2] = mx;
          id(cal_raw)[s * 2 + 1] = my;
          ESP_LOGI("cal", "cross %d: raw %d,%d from %d readings", s + 1, mx, my, (int) n);
          id(cal_step) = s + 1;
      - if:
          condition:
            lambda: "return id(cal_active) && id(cal_step) < 4;"
          then:
            - lvgl.widget.update:
                id: cal_cross
                x: !lambda "static const int xs[] = {26, 426, 426, 26}; return xs[id(cal_step)];"
                y: !lambda "static const int ys[] = {26, 26, 266, 266}; return ys[id(cal_step)];"
            - lvgl.label.update:
                id: cal_hint
                text: !lambda 'return str_sprintf("TIK OP HET KRUIS  %d/4", id(cal_step) + 1);'
      - if:
          condition:
            lambda: "return id(cal_active) && id(cal_step) >= 4;"
          then:
            - script.execute: calibration_finish

  - id: calibration_finish
    then:
      - lambda: |-
          id(cal_active) = false;
          const auto &r = id(cal_raw);
          // native x is 279 at crosses 0,1 and 39 at 2,3; native y is 40 at 0,3 and 440 at 1,2
          auto mean2 = [&](int a, int b, int axis) { return (r[a * 2 + axis] + r[b * 2 + axis]) / 2.0f; };
          // without swap native x follows raw x; with swap it follows raw y
          const float plain = fabsf(mean2(0, 1, 0) - mean2(2, 3, 0)) + fabsf(mean2(1, 2, 1) - mean2(0, 3, 1));
          const float swapped = fabsf(mean2(0, 1, 1) - mean2(2, 3, 1)) + fabsf(mean2(1, 2, 0) - mean2(0, 3, 0));
          const bool swap = swapped > plain;
          const int ax = swap ? 1 : 0, ay = swap ? 0 : 1;
          // the raw value along a native axis at its two levels, extended to the panel's edges
          auto fit = [](float raw_lo, float raw_hi, float lo, float hi, float span, int &mn, int &mx, bool &mirror) {
            const float per = (raw_hi - raw_lo) / (hi - lo);
            const float at0 = raw_lo - lo * per, at_end = at0 + span * per;
            mirror = per < 0;
            mn = (int) std::min(at0, at_end);
            mx = (int) std::max(at0, at_end);
          };
          int xmn, xmx, ymn, ymx;
          bool mirror_x, mirror_y;
          fit(mean2(2, 3, ax), mean2(0, 1, ax), 39, 279, 320, xmn, xmx, mirror_x);
          fit(mean2(0, 3, ay), mean2(1, 2, ay), 40, 440, 480, ymn, ymx, mirror_y);
          if (xmx - xmn < 400 || ymx - ymn < 400) {
            ESP_LOGW("cal", "calibration rejected: x %d..%d y %d..%d", xmn, xmx, ymn, ymx);
            if (id(cal_ok)) {
              id(touch).set_swap_xy(id(cal_swap));
              id(touch).set_mirror_x(id(cal_mirror_x));
              id(touch).set_mirror_y(id(cal_mirror_y));
            }
            return;
          }
          id(cal_x_min) = xmn; id(cal_x_max) = xmx; id(cal_y_min) = ymn; id(cal_y_max) = ymx;
          id(cal_swap) = swap; id(cal_mirror_x) = mirror_x; id(cal_mirror_y) = mirror_y;
          id(cal_ok) = true;
          id(cal_version) = 2;
          id(touch).set_calibration(xmn, xmx, ymn, ymx);
          id(touch).set_swap_xy(swap);
          id(touch).set_mirror_x(mirror_x);
          id(touch).set_mirror_y(mirror_y);
          ESP_LOGI("cal", "touch calibrated: x %d..%d y %d..%d swap %d mirror %d %d", xmn, xmx, ymn, ymx, swap, mirror_x, mirror_y);
      - lvgl.label.update:
          id: cal_hint
          text: !lambda 'return id(cal_ok) ? std::string("GEKALIBREERD") : std::string("MISLUKT, PROBEER OPNIEUW");'
      - delay: 1500ms
      - lvgl.page.show: home_page

# ---- The screen ----------------------------------------------------------------
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm

light:
  - platform: monochromatic
    id: backlight
    name: Scherm
    output: backlight_pwm
    gamma_correct: 1.0 # a backlight, not a lamp: 50 % should look like half, not 2 %
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

display:
  - platform: mipi_spi
    id: screen
    model: ST7796
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    data_rate: 40MHz
    dimensions:
      width: 320
      height: 480
    buffer_size: 12.5%
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    # firm presses only: a light touch on a resistive panel reads towards the
    # middle (seen 2026-10-11: one spot read both ~900,1200 and ~2300,2400)
    threshold: 900
    calibration:
      x_min: 300
      x_max: 3800
      y_min: 300
      y_max: 3800
    on_update:
      # during a calibration every reading of a press counts (the median is used)
      - lambda: |-
          if (!id(cal_active)) return;
          for (auto &t : touches) {
            id(cal_samples_x).push_back(t.x_raw);
            id(cal_samples_y).push_back(t.y_raw);
          }
    on_release:
      - logger.log: "touch released"
      - if:
          condition:
            lambda: "return id(cal_active);"
          then:
            - script.execute: calibration_press
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw=%d,%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]
      - light.turn_on:
          id: backlight
          brightness: !lambda "return id(brightness_pct) / 100.0f;"

font:
  - file: "gfonts://Orbitron@700"
    id: f_huge
    size: 50
    glyphs: "0123456789-"
  - file: "gfonts://Orbitron@600"
    id: f_head
    size: 18
    glyphs: " !%+,-./0123456789:°ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Orbitron@600"
    id: f_num
    size: 20
    glyphs: " %+,-.0123456789°D"
  - file: "gfonts://Orbitron@500"
    id: f_btn
    size: 15
    glyphs: " +-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  - file: "gfonts://Rajdhani@600"
    id: f_label
    size: 14
    glyphs: " !%(),-./0123456789:°ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz·…"
  - file: "gfonts://Rajdhani@600"
    id: f_tiny
    size: 12
    glyphs: " !%(),-./0123456789:°ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz·…"

lvgl:
  displays: [screen]
  touchscreens: [touch]
  rotation: 90 # landscape
  buffer_size: 12.5%
  on_idle:
    - timeout: 60s
      then:
        - if:
            condition:
              lambda: "return !id(cal_active);"
            then:
              - light.turn_on:
                  id: backlight
                  brightness: !lambda "return id(brightness_pct) / 200.0f;"
    - timeout: 120s
      then:
        - if:
            condition:
              lambda: "return !id(cal_active);"
            then:
              - lvgl.page.show: home_page # a forgotten settings page goes back
  style_definitions:
    # a HUD frame: dark glass, a hairline in cyan
    - id: frame
      bg_color: ${panel}
      bg_opa: 85%
      border_color: ${cyan}
      border_opa: 35%
      border_width: 1
      radius: 6
      pad_all: 6
    - id: hud_btn
      bg_color: ${panel}
      bg_opa: COVER
      border_color: ${cyan}
      border_opa: 60%
      border_width: 1
      radius: 6
      shadow_width: 0
      text_color: ${cyan}
      text_font: f_btn
    - id: hud_on
      bg_color: ${cyan}
      bg_opa: COVER
      text_color: ${bg}
      border_opa: COVER
  theme:
    label:
      text_color: ${text}
      text_font: f_label
  pages:
    # ============================== main page ==============================
    - id: home_page
      bg_color: ${bg}
      bg_opa: COVER
      scrollable: false
      widgets:
        # ---- a faint grid behind everything ----
        - line: { points: ["0, 80", "480, 80"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["0, 160", "480, 160"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["0, 240", "480, 240"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["120, 36", "120, 268"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["240, 36", "240, 268"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["360, 36", "360, 268"], line_width: 1, line_color: "${grid}", line_opa: 50% }

        # ---- header ----
        - label:
            x: 12
            y: 9
            text: "WTW"
            text_font: f_head
            text_color: ${cyan}
        - label:
            x: 66
            y: 12
            text: "// DUCO ENERGY COMFORT"
            text_font: f_tiny
            text_color: ${dim}
        - obj:
            id: link_dot
            x: 262
            y: 15
            width: 8
            height: 8
            radius: 4
            bg_color: ${red}
            border_width: 0
        - label:
            id: link_label
            x: 275
            y: 11
            text: "OFFLINE"
            text_font: f_tiny
            text_color: ${red}
        - label:
            id: clock_label
            x: 350
            y: 9
            text: "--:--"
            text_font: f_head
            text_color: ${text}
        - button:
            x: 428
            y: 2
            width: 46
            height: 30
            styles: hud_btn
            widgets:
              - label: { align: CENTER, text: "", text_font: montserrat_18 }
            on_click:
              - script.execute: show_status
              - lvgl.page.show: settings_page
        - line: { points: ["0, 34", "480, 34"], line_width: 1, line_color: "${cyan}", line_opa: 40% }

        # ---- left: the airflow reactor ----
        - arc:
            x: 12
            y: 40
            width: 186
            height: 186
            start_angle: 0
            end_angle: 360
            value: 0
            adjustable: false
            arc_width: 1
            arc_color: ${cyan}
            arc_opa: 35%
            indicator: { arc_opa: TRANSP }
            knob: { bg_opa: TRANSP }
        - spinner:
            id: flow_spin
            x: 12
            y: 40
            width: 186
            height: 186
            spin_time: 2400ms
            arc_length: 70deg
            arc_width: 3
            arc_opa: TRANSP
            indicator:
              arc_color: ${cyan}
              arc_width: 3
              arc_rounded: true
            hidden: true
        - arc:
            id: flow_arc
            x: 27
            y: 55
            width: 156
            height: 156
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_width: 12
            arc_color: ${cyan_dim}
            arc_rounded: false
            indicator:
              arc_color: ${cyan}
              arc_width: 12
              arc_rounded: false
            knob: { bg_opa: TRANSP }
        - label:
            id: flow_value
            x: 30
            y: 98
            width: 150
            text_align: CENTER
            text: "--"
            text_font: f_huge
            text_color: ${text}
        - label:
            x: 30
            y: 154
            width: 150
            text_align: CENTER
            text: "% LUCHTDEBIET"
            text_font: f_tiny
            text_color: ${dim}
        - label:
            id: fan_label
            x: 6
            y: 168
            width: 198
            text_align: CENTER
            text: "VENTILATOREN --"
            text_font: f_tiny
            text_color: ${amber}
        - label:
            id: mode_label
            x: 0
            y: 228
            width: 210
            text_align: CENTER
            long_mode: DOT
            text: "STANDBY"
            text_font: f_head
            text_color: ${amber}
        - label:
            id: mode_sub
            x: 0
            y: 250
            width: 210
            text_align: CENTER
