# The WTW (DucoBox Energy Comfort) in Home Assistant, with its own screen.
#
# Hardware: a "Cheap Yellow Display" ESP32-3248S035R (ESP32-WROOM-32, no
# PSRAM, 3.5" 480x320 ST7796 over SPI, resistive XPT2046 touch, CH340 USB
# serial), on the Duco's Connectivity header where the Duco Connectivity Board
# would sit. The Duco speaks UART at 57600 baud, 3.3 V, straight to the ESP
# (kokx/duco-analysis); the component is kokx's, not yet merged into ESPHome
# (esphome/esphome#7993).
#
# Wiring (Duco header, kokx's numbering -> the board's serial connector P1,
# beside the USB-C): pin 0 GND -> GND, pin 1 5 V -> VIN (the Duco powers the
# board; leave USB out meanwhile), pins 8/9 -> P1's RX and TX. With the wires as
# they ended up, the ESP listens on GPIO1 and talks on GPIO3 (found by trying
# both ways round on 2026-10-11). P1 is UART0, so the board logs over Wi-Fi only.
# The Duco's 10 V pin is never connected.
#
# Built and flashed from the HA server with ESPHome's Docker image; secrets in
# esphome/secrets.yaml (gitignored). See esphome/README.md.
#
# The screen is a HUD: near-black with a faint grid, neon cyan and amber,
# Orbitron for figures (the wall panel's display face) and Rajdhani for
# labels. Left the airflow as a reactor ring (a light runs round it while air
# moves), right the heat exchanger as a live diagram — outside air in and on
# to the house in cyan, the house's air out and away in amber, crossing in
# the core, which shows the recovery efficiency from the four temperatures —
# and along the bottom the stand: AUTO · I · II · III.
substitutions:
  bg: "0x05070A"
  panel: "0x0A1016"
  grid: "0x0E2A33"
  cyan: "0x00E5FF"
  cyan_dim: "0x0B3A44"
  ice: "0x7FF3FF"
  amber: "0xFFB547"
  amber_dim: "0x6B4A1C"
  text: "0xE6F7FF"
  dim: "0x5F7A86"
  green: "0x38F2A0"
  red: "0xFF4D6A"

esphome:
  name: wtw-duco
  friendly_name: WTW
  on_boot:
    priority: -100
    then:
      - script.execute: show_mode
      - script.execute: show_efficiency

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: WTW fallback
    password: !secret fallback_password

captive_portal:

logger:
  baud_rate: 0 # P1 (UART0) is the Duco's; logs go over Wi-Fi

api:
  encryption:
    key: !secret api_key
  on_client_connected:
    - lvgl.widget.update:
        id: link_dot
        bg_color: ${green}
    - lvgl.label.update:
        id: link_label
        text: "LINK"
        text_color: ${green}
  on_client_disconnected:
    - lvgl.widget.update:
        id: link_dot
        bg_color: ${red}
    - lvgl.label.update:
        id: link_label
        text: "OFFLINE"
        text_color: ${red}

ota:
  - platform: esphome
    password: !secret ota_password

time:
  - platform: homeassistant
    id: ha_time

# ---- The Duco ----------------------------------------------------------------
external_components:
  - source: github://pr#7993
    components: [duco]

uart:
  id: duco_uart
  rx_pin: GPIO1 # P1, from the Duco's TX
  tx_pin: GPIO3 # P1, to the Duco's RX
  baud_rate: 57600
  rx_buffer_size: 256

duco:
  id: duco_box
  uart_id: duco_uart
  discovery: {} # logs the nodes it finds (the box, its sensors)

select:
  - platform: duco
    id: duco_mode
    name: Stand
    on_value:
      - script.execute: show_mode

sensor:
  - platform: duco
    flow_level:
      id: flow
      name: Debiet
      on_value:
        - lvgl.arc.update:
            id: flow_arc
            value: !lambda "return isnan(x) ? 0 : (int) x;"
        - lvgl.label.update:
            id: flow_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%d", (int) x);'
        # the light round the ring runs while air moves
        - lvgl.widget.update:
            id: flow_spin
            hidden: !lambda "return isnan(x) || x < 1;"
    time_remaining:
      id: time_left
      name: Tijd resterend
      on_value:
        - script.execute: show_mode
    filter_remaining:
      id: filter_left
      name: Filter resterend
      on_value:
        - lvgl.label.update:
            id: filter_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%dD", (int) x);'
        - lvgl.bar.update:
            id: filter_bar
            value: !lambda "return isnan(x) ? 0 : std::min(180, (int) x);"
    bypass:
      id: bypass
      name: Bypass
      on_value:
        - lvgl.label.update:
            id: bypass_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%d%%", (int) x);'
        - lvgl.bar.update:
            id: bypass_bar
            value: !lambda "return isnan(x) ? 0 : (int) x;"
    temperature_oda:
      id: t_oda
      name: Buitenlucht
      on_value:
        - lvgl.label.update:
            id: oda_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
        - script.execute: show_efficiency
    temperature_sup:
      id: t_sup
      name: Toevoer
      on_value:
        - lvgl.label.update:
            id: sup_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
        - script.execute: show_efficiency
    temperature_eta:
      id: t_eta
      name: Afzuiging
      on_value:
        - lvgl.label.update:
            id: eta_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
        - script.execute: show_efficiency
    temperature_eha:
      id: t_eha
      name: Afvoer
      on_value:
        - lvgl.label.update:
            id: eha_value
            text: !lambda 'return isnan(x) ? std::string("--") : str_sprintf("%.1f°", x);'
  - platform: wifi_signal
    name: Wifi-signaal
    update_interval: 60s
  # How much of the house's warmth the exchanger gives back to the air coming
  # in: (supply − outside) / (extract − outside). Meaningless when inside and
  # outside are about as warm, so then it says nothing.
  - platform: template
    id: efficiency
    name: Rendement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: duco
    name: Serienummer

script:
  # A tap on a stand: that button lights at once and the others go out, the
  # stand goes to the Duco, and until it answers the line under says so.
  - id: pick_stand
    mode: restart # a second tap within the wait takes over
    parameters:
      which: int
    then:
      - lvgl.widget.update: { id: btn_auto, state: { checked: !lambda "return which == 0;" } }
      - lvgl.widget.update: { id: btn_1, state: { checked: !lambda "return which == 1;" } }
      - lvgl.widget.update: { id: btn_2, state: { checked: !lambda "return which == 2;" } }
      - lvgl.widget.update: { id: btn_3, state: { checked: !lambda "return which == 3;" } }
      - lvgl.label.update:
          id: mode_sub
          text: "naar de Duco verstuurd…"
      - select.set:
          id: duco_mode
          option: !lambda 'static const char *const opts[] = {"AUTO", "MAN1", "MAN2", "MAN3"}; return std::string(opts[which]);'
      - delay: 8s
      # no answer: show what the Duco really runs (or that it is silent)
      - script.execute: show_mode
  # The stand in words, how long a manual one still runs, which button is lit.
  - id: show_mode
    then:
      - lvgl.label.update:
          id: mode_label
          text: !lambda |-
            if (!id(duco_mode).has_state()) return std::string("STANDBY");
            const std::string m = id(duco_mode).current_option();
            if (m == "AUTO") return std::string("AUTOMATISCH");
            if (m == "EMPT") return std::string("AFWEZIG");
            if (m.size() >= 4 && (m.rfind("MAN", 0) == 0 || m.rfind("CNT", 0) == 0)) {
              std::string s = "STAND " + m.substr(3, 1);
              if (m.rfind("CNT", 0) == 0) s += " CONTINU";
              return s;
            }
            return m;
      - lvgl.label.update:
          id: mode_sub
          text: !lambda |-
            if (!id(duco_mode).has_state()) return std::string("wacht op de Duco");
            const float t = id(time_left).state;
            if (isnan(t) || t <= 0) return std::string("");
            const int s = (int) t;
            return s >= 3600 ? str_sprintf("nog %d:%02d uur", s / 3600, (s % 3600) / 60)
                             : str_sprintf("nog %d:%02d min", s / 60, s % 60);
      - lvgl.widget.update:
          id: btn_auto
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option() == "AUTO";'
      - lvgl.widget.update:
          id: btn_1
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option().find("1") == 3;'
      - lvgl.widget.update:
          id: btn_2
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option().find("2") == 3;'
      - lvgl.widget.update:
          id: btn_3
          state:
            checked: !lambda 'return id(duco_mode).has_state() && id(duco_mode).current_option().find("3") == 3;'
  - id: show_efficiency
    then:
      - lambda: |-
          const float oda = id(t_oda).state, sup = id(t_sup).state, eta = id(t_eta).state;
          float eff = NAN;
          if (!isnan(oda) && !isnan(sup) && !isnan(eta) && fabsf(eta - oda) >= 3.0f)
            eff = std::max(0.0f, std::min(100.0f, (sup - oda) / (eta - oda) * 100.0f));
          if (isnan(eff) != isnan(id(efficiency).state) || (!isnan(eff) && fabsf(eff - id(efficiency).state) >= 1.0f))
            id(efficiency).publish_state(eff);
      - lvgl.label.update:
          id: eff_value
          text: !lambda 'const float e = id(efficiency).state; return isnan(e) ? std::string("--") : str_sprintf("%d%%", (int) e);'

# ---- The screen ----------------------------------------------------------------
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

output:
  - platform: ledc
    pin: GPIO27
    id: backlight_pwm

light:
  - platform: monochromatic
    id: backlight
    name: Scherm
    output: backlight_pwm
    gamma_correct: 1.0 # a backlight, not a lamp: 50 % should look like half, not 2 %
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

display:
  - platform: mipi_spi
    id: screen
    model: ST7796
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    data_rate: 40MHz
    dimensions:
      width: 320
      height: 480
    buffer_size: 12.5%
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw=%d,%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]
      - light.turn_on:
          id: backlight
          brightness: 100%

font:
  - file: "gfonts://Orbitron@700"
    id: f_huge
    size: 50
    glyphs: "0123456789-"
  - file: "gfonts://Orbitron@600"
    id: f_head
    size: 18
    glyphs: "0123456789%-:/°.,ABCDEFGHIJKLMNOPQRSTUVWXYZ "
  - file: "gfonts://Orbitron@600"
    id: f_num
    size: 20
    glyphs: "0123456789%-°.,D"
  - file: "gfonts://Orbitron@500"
    id: f_btn
    size: 16
    glyphs: "AUTOI "
  - file: "gfonts://Rajdhani@600"
    id: f_label
    size: 14
    glyphs: "0123456789%-:/°.,·… ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
  - file: "gfonts://Rajdhani@600"
    id: f_tiny
    size: 12
    glyphs: "0123456789%-:/°.,· ABCDEFGHIJKLMNOPQRSTUVWXYZ"

lvgl:
  displays: [screen]
  touchscreens: [touch]
  rotation: 90 # landscape, the USB-C on the right
  buffer_size: 12.5%
  on_idle:
    - timeout: 60s
      then:
        - light.turn_on:
            id: backlight
            brightness: 50%
  style_definitions:
    # a HUD frame: dark glass, a hairline in cyan
    - id: frame
      bg_color: ${panel}
      bg_opa: 85%
      border_color: ${cyan}
      border_opa: 35%
      border_width: 1
      radius: 6
      pad_all: 6
    - id: hud_btn
      bg_color: ${panel}
      bg_opa: COVER
      border_color: ${cyan}
      border_opa: 60%
      border_width: 1
      radius: 6
      shadow_width: 0
      text_color: ${cyan}
      text_font: f_btn
  theme:
    label:
      text_color: ${text}
      text_font: f_label
  pages:
    - id: home_page
      bg_color: ${bg}
      bg_opa: COVER
      scrollable: false
      widgets:
        # ---- a faint grid behind everything ----
        - line: { points: ["0, 80", "480, 80"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["0, 160", "480, 160"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["0, 240", "480, 240"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["120, 36", "120, 260"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["240, 36", "240, 260"], line_width: 1, line_color: "${grid}", line_opa: 50% }
        - line: { points: ["360, 36", "360, 260"], line_width: 1, line_color: "${grid}", line_opa: 50% }

        # ---- header ----
        - label:
            x: 12
            y: 9
            text: "WTW"
            text_font: f_head
            text_color: ${cyan}
        - label:
            x: 66
            y: 12
            text: "// DUCO ENERGY COMFORT"
            text_font: f_tiny
            text_color: ${dim}
        - obj:
            id: link_dot
            x: 300
            y: 15
            width: 8
            height: 8
            radius: 4
            bg_color: ${red}
            border_width: 0
        - label:
            id: link_label
            x: 313
            y: 11
            text: "OFFLINE"
            text_font: f_tiny
            text_color: ${red}
        - label:
            id: clock_label
            x: 404
            y: 9
            text: "--:--"
            text_font: f_head
            text_color: ${text}
        - line: { points: ["0, 34", "480, 34"], line_width: 1, line_color: "${cyan}", line_opa: 40% }

        # ---- left: the airflow reactor ----
        - arc:
            x: 12
            y: 42
            width: 186
            height: 186
            start_angle: 0
            end_angle: 360
            value: 0
            adjustable: false
            arc_width: 1
            arc_color: ${cyan}
            arc_opa: 35%
            indicator: { arc_opa: TRANSP }
            knob: { bg_opa: TRANSP }
        - spinner:
            id: flow_spin
            x: 12
            y: 42
            width: 186
            height: 186
            spin_time: 2400ms
            arc_length: 70deg
            arc_width: 3
            arc_opa: TRANSP
            indicator:
              arc_color: ${cyan}
              arc_width: 3
              arc_rounded: true
            hidden: true
        - arc:
            id: flow_arc
            x: 27
            y: 57
            width: 156
            height: 156
            min_value: 0
            max_value: 100
            value: 0
            adjustable: false
            arc_width: 12
            arc_color: ${cyan_dim}
            arc_rounded: false
            indicator:
              arc_color: ${cyan}
              arc_width: 12
              arc_rounded: false
            knob: { bg_opa: TRANSP }
        - label:
            id: flow_value
            x: 30
            y: 100
            width: 150
            text_align: CENTER
            text: "--"
            text_font: f_huge
            text_color: ${text}
        - label:
            x: 30
            y: 156
            width: 150
            text_align: CENTER
            text: "% LUCHTDEBIET"
            text_font: f_tiny
            text_color: ${dim}
        - label:
            id: mode_label
            x: 6
            y: 230
            width: 198
            text_align: CENTER
            text: "STANDBY"
            text_font: f_head
            text_color: ${amber}
        - label:
            id: mode_sub
            x: 6
            y: 252
            width: 198
            text_align: CENTER
            text: "wacht op de Duco"
            text_font: f_label
            text_color: ${dim}

        # ---- right: the heat exchanger ----
        # the two streams cross in the core: outside -> house (cold), house -> outside (warm)
        - line: { points: ["292, 86", "390, 210"], line_width: 3, line_color: "${cyan}", line_opa: 90% }
        - line: { points: ["390, 86", "292, 210"], line_width: 3, line_color: "${amber}", line_opa: 90% }
        - obj:
            x: 300
            y: 108
            width: 82
            height: 82
            radius: 41
            bg_color: ${bg}
            bg_opa: COVER
            border_color: ${cyan}
            border_width: 2
            scrollable: false
            widgets:
              - label:
                  id: eff_value
                  align: CENTER
                  y: -6
                  text: "--"
                  text_font: f_num
                  text_color: ${green}
              - label:
                  align: CENTER
                  y: 16
                  text: "RENDEMENT"
                  text_font: f_tiny
                  text_color: ${dim}
        # outside air in (top left) and exhaust out (bottom left)
        - obj:
            x: 206
            y: 42
            width: 90
            height: 48
            styles: frame
            scrollable: false
            widgets:
              - label: { text: "BUITEN IN", text_font: f_tiny, text_color: "${dim}" }
              - label: { id: oda_value, y: 14, text: "--", text_font: f_num, text_color: "${ice}" }
        - obj:
            x: 206
            y: 206
            width: 90
            height: 48
            styles: frame
            scrollable: false
            widgets:
              - label: { text: "AFVOER", text_font: f_tiny, text_color: "${dim}" }
              - label: { id: eha_value, y: 14, text: "--", text_font: f_num, text_color: "${amber_dim}" }
        # the house: its air out (top right) and fresh air in (bottom right)
        - obj:
            x: 384
            y: 42
            width: 90
            height: 48
            styles: frame
            scrollable: false
            widgets:
              - label: { text: "UIT HUIS", text_font: f_tiny, text_color: "${dim}" }
              - label: { id: eta_value, y: 14, text: "--", text_font: f_num, text_color: "${amber}" }
        - obj:
            x: 384
            y: 206
            width: 90
            height: 48
            styles: frame
            scrollable: false
            widgets:
              - label: { text: "NAAR HUIS", text_font: f_tiny, text_color: "${dim}" }
              - label: { id: sup_value, y: 14, text: "--", text_font: f_num, text_color: "${cyan}" }
        # bypass and filter between the bottom corners
        - label: { x: 300, y: 214, text: "BYPASS", text_font: f_tiny, text_color: "${dim}" }
        - label: { id: bypass_value, x: 300, y: 214, width: 80, text_align: RIGHT, text: "--", text_font: f_tiny, text_color: "${text}" }
        - bar:
            id: bypass_bar
            x: 300
            y: 229
            width: 80
            height: 4
            min_value: 0
            max_value: 100
            value: 0
            bg_color: ${cyan_dim}
            radius: 2
            indicator: { bg_color: "${amber}", radius: 2 }
        - label: { x: 300, y: 236, text: "FILTER", text_font: f_tiny, text_color: "${dim}" }
        - label: { id: filter_value, x: 300, y: 236, width: 80, text_align: RIGHT, text: "--", text_font: f_tiny, text_color: "${text}" }
        - bar:
            id: filter_bar
            x: 300
            y: 251
            width: 80
            height: 4
            min_value: 0
            max_value: 180
            value: 0
            bg_color: ${cyan_dim}
            radius: 2
            indicator: { bg_color: "${green}", radius: 2 }

        # ---- bottom: the stand ----
        - line: { points: ["0, 270", "480, 270"], line_width: 1, line_color: "${cyan}", line_opa: 40% }
        - button:
            id: btn_auto
            x: 8
            y: 276
            width: 112
            height: 38
            styles: hud_btn
            checkable: false
            checked: { bg_color: "${cyan}", bg_opa: COVER, text_color: "${bg}", border_opa: COVER }
            widgets:
              - label: { align: CENTER, text: "AUTO", text_font: f_btn }
            on_click:
              - script.execute: { id: pick_stand, which: 0 }
        - button:
            id: btn_1
            x: 126
            y: 276
            width: 112
            height: 38
            styles: hud_btn
            checkable: false
            checked: { bg_color: "${cyan}", bg_opa: COVER, text_color: "${bg}", border_opa: COVER }
            widgets:
              - label: { align: CENTER, text: "I", text_font: f_btn }
            on_click:
              - script.execute: { id: pick_stand, which: 1 }
        - button:
            id: btn_2
            x: 244
            y: 276
            width: 112
            height: 38
            styles: hud_btn
            checkable: false
            checked: { bg_color: "${cyan}", bg_opa: COVER, text_color: "${bg}", border_opa: COVER }
            widgets:
              - label: { align: CENTER, text: "II", text_font: f_btn }
            on_click:
              - script.execute: { id: pick_stand, which: 2 }
        - button:
            id: btn_3
            x: 362
            y: 276
            width: 110
            height: 38
            styles: hud_btn
            checkable: false
            checked: { bg_color: "${cyan}", bg_opa: COVER, text_color: "${bg}", border_opa: COVER }
            widgets:
              - label: { align: CENTER, text: "III", text_font: f_btn }
            on_click:
              - script.execute: { id: pick_stand, which: 3 }

interval:
  - interval: 10s
    then:
      - if:
          condition:
            time.has_time:
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
