interval:
  - interval: 1s
    then:
      - lambda: "if (duco_extra()) duco_extra()->poll();"
  - interval: 10s
    then:
      - if:
          condition:
            time.has_time:
          then:
            - lvgl.label.update:
                id: clock_label
                text: !lambda 'return id(ha_time).now().strftime("%H:%M");'
      - script.execute: show_status
