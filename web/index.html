<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0c0e12">
  <meta name="panel-version" content="__VERSION__">
  <!-- Home-screen web app (iPad/iPhone "Zet op beginscherm", Android install):
       full screen, own icon, the page runs under a transparent status bar. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thuis">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json?v=__VERSION__">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon-167.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <title>Thuis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- The fonts are fetched without blocking the first paint: as a print sheet
       until loaded (a tablet without internet would otherwise wait for the
       timeout), the system fonts in the meantime (base.css has the stacks). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Orbitron:wght@600&family=Audiowide&family=Rajdhani:wght@500;600;700&family=Comfortaa:wght@500;700&family=Space+Mono:wght@400;700&family=VT323&family=Poppins:wght@500;600;700&family=Cinzel:wght@500;600;700&family=Inter:wght@500;600;700&family=Josefin+Sans:wght@500;600;700&family=Bebas+Neue&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/base.css?v=__VERSION__">
  <link rel="stylesheet" href="css/header.css?v=__VERSION__">
  <link rel="stylesheet" href="css/rail.css?v=__VERSION__">
  <link rel="stylesheet" href="css/start.css?v=__VERSION__">
  <link rel="stylesheet" href="css/lighting.css?v=__VERSION__">
  <link rel="stylesheet" href="css/controls.css?v=__VERSION__">
  <link rel="stylesheet" href="css/vacuum.css?v=__VERSION__">
  <link rel="stylesheet" href="css/planning.css?v=__VERSION__">
  <link rel="stylesheet" href="css/car.css?v=__VERSION__">
  <link rel="stylesheet" href="css/appliances.css?v=__VERSION__">
  <link rel="stylesheet" href="css/cards.css?v=__VERSION__">
  <link rel="stylesheet" href="css/energy.css?v=__VERSION__">
  <link rel="stylesheet" href="css/climate.css?v=__VERSION__">
  <link rel="stylesheet" href="css/settings.css?v=__VERSION__">
  <link rel="stylesheet" href="css/saver.css?v=__VERSION__">
</head>
<body>
  <div id="app" hidden>
    <header id="header">
      <div class="hdr-strip">
        <div id="forecast" class="fc"></div>
        <div class="rule"></div>
        <div id="sensors" class="sensors"></div>
      </div>
      <div class="hdr-right">
        <div class="timebox">
          <div id="clock" class="clock">--:--</div>
          <div class="daterow"><span id="dow" class="dow"></span><span id="date" class="date"></span></div>
        </div>
        <div id="status" class="status" title="Verbinding"></div>
        <button id="gear" class="gear" aria-label="Instellingen"></button>
      </div>
    </header>
    <nav id="tabbar" class="tabbar"><div id="tabind" class="tabind"></div></nav>
    <main id="stage" class="stage">
      <div id="connbar" class="connbar" hidden>Geen verbinding met Home Assistant &middot; opnieuw verbinden&hellip;</div>
      <div id="track" class="track"></div>
      <div id="bright" class="vslider" hidden>
        <div class="vs-label" id="brightLabel"></div>
        <div class="vs-track"><div class="vs-fill"></div><div class="vs-knob"></div></div>
      </div>
      <div id="sceneSave" class="scene-save" hidden><span class="ss-text"></span><span class="ss-btns"><button class="ss-btn primary" data-ss="yes">Ja</button><button class="ss-btn" data-ss="no">Nee</button></span></div>
    </main>
  </div>

  <div id="drawer" class="drawer" aria-hidden="true"><div id="drawerGrid" class="drawer-grid"></div></div>

  <div id="popup" class="overlay" hidden>
    <div class="box popup-box">
      <div class="box-head popup-head">
        <button id="popupPower" class="popup-power" aria-label="Aan of uit"></button>
        <div id="popupTitle" class="popup-title"></div>
        <button id="popupEdit" class="close-btn popup-edit" aria-label="Naam wijzigen"></button>
        <button id="popupClose" class="close-btn" aria-label="Sluiten"></button>
      </div>
      <div class="field-label">Helderheid <span id="popupBrightVal" class="field-value"></span></div>
      <div id="popupBright" class="hslider"><div class="hs-fill"></div><div class="hs-knob"></div></div>
      <div id="popupColorWrap" hidden>
        <div class="field-label">Kleur</div>
        <div id="popupColor" class="hslider hue"><div class="hs-knob"></div></div>
      </div>
      <div id="popupWarmWrap" hidden>
        <div class="field-label">Warmte</div>
        <div id="popupWarm" class="hslider warm"><div class="hs-knob"></div></div>
      </div>
      <div class="field-label popup-name-label" hidden>Naam</div>
      <div class="popup-name" hidden>
        <input id="popupName" type="text" maxlength="40" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Naam van de lamp">
        <button id="popupRename" type="button" disabled>Opslaan</button>
      </div>
    </div>
  </div>

  <div id="climate" class="overlay" hidden>
    <div class="box clim-box">
      <div class="box-head">
        <div id="climTitle" class="box-title"></div>
        <div id="climNow" class="clim-now"></div>
        <button id="climClose" class="close-btn" aria-label="Sluiten"></button>
      </div>
      <div id="climStats" class="clim-stats" hidden></div>
      <div class="clim-chart-wrap"><canvas id="climChart"></canvas></div>
      <div id="climRange" class="clim-range"></div>
      <div id="climAdvice" class="clim-advice"></div>
    </div>
  </div>

  <div id="settings" class="overlay" hidden>
    <div class="box settings-box">
      <div class="box-head">
        <div class="box-title">Instellingen</div>
        <button id="settingsClose" class="close-btn" aria-label="Sluiten"></button>
      </div>
      <div class="set-row">
        <div class="set-title">Thema</div>
        <div id="themeList" class="theme-list"></div>
      </div>
      <div class="set-row">
        <div class="set-title">Screensaver</div>
        <div class="seg" id="saverMode"></div>
        <div class="seg" id="saverTime"></div>
      </div>
      <div class="set-row">
        <div class="set-title">Geluid</div>
        <div class="seg" id="soundMode"></div>
      </div>
      <div class="set-row">
        <div class="set-title">Verbinding</div>
        <div id="connInfo" class="set-value"></div>
        <button id="logout" class="text-btn"></button>
      </div>
    </div>
  </div>

  <div id="plan" class="overlay" hidden>
    <div class="box plan-box">
      <div class="box-head">
        <div id="planTitle" class="box-title">Planning</div>
        <button id="planClose" class="close-btn" aria-label="Sluiten"></button>
      </div>
      <div id="planBody"></div>
    </div>
  </div>

  <div id="saver" class="saver" hidden>
    <div id="eyeGroup" class="eye-group">
      <div class="eye-wrap">
        <img class="eye" src="assets/eye.png" alt="" draggable="false">
        <div class="eye-glow"></div>
        <svg class="eye-ring" viewBox="0 0 470 470" aria-hidden="true">
          <path d="M 235 2 A 233 233 0 0 1 413.5 85.2" fill="none" stroke="#ff8a3d" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="eyeTemps" class="eye-temps"></div>
      <div id="eyeMedia" class="eye-media" hidden><div class="where"></div><div class="what"></div></div>
    </div>
    <div id="saverClock" class="saver-clock">--:--</div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="splash" class="splash">
    <img src="assets/splash.jpg" alt="">
    <div class="splash-title"><span id="splashTitle">T-1000 Automation</span></div>
    <div class="splash-bottom">
      <div id="splashStatus" class="splash-status">Verbinden met Home Assistant</div>
      <div class="splash-bar"><div id="splashFill"></div></div>
    </div>
  </div>

  <script src="js/diag.js?v=__VERSION__"></script>
  <script src="js/config.js?v=__VERSION__"></script>
  <script src="js/icons.js?v=__VERSION__"></script>
  <script src="js/util.js?v=__VERSION__"></script>
  <script src="js/ha.js?v=__VERSION__"></script>
  <script src="js/ha-demo.js?v=__VERSION__"></script>
  <script src="js/core.js?v=__VERSION__"></script>
  <script src="js/toast.js?v=__VERSION__"></script>
  <script src="js/commands.js?v=__VERSION__"></script>
  <script src="js/gestures.js?v=__VERSION__"></script>
  <script src="js/readings.js?v=__VERSION__"></script>
  <script src="js/header.js?v=__VERSION__"></script>
  <script src="js/sections.js?v=__VERSION__"></script>
  <script src="js/rail.js?v=__VERSION__"></script>
  <script src="js/house-plan.js?v=__VERSION__"></script>
  <script src="js/house3d.js?v=__VERSION__"></script>
  <script src="js/start.js?v=__VERSION__"></script>
  <script src="js/hud.js?v=__VERSION__"></script>
  <script src="js/scene-colours.js?v=__VERSION__"></script>
  <script src="js/lighting.js?v=__VERSION__"></script>
  <script src="js/floors.js?v=__VERSION__"></script>
  <script src="js/areas.js?v=__VERSION__"></script>
  <script src="js/drawer.js?v=__VERSION__"></script>
  <script src="js/sliders.js?v=__VERSION__"></script>
  <script src="js/photos.js?v=__VERSION__"></script>
  <script src="js/cleaning.js?v=__VERSION__"></script>
  <script src="js/vacuum.js?v=__VERSION__"></script>
  <script src="js/planning.js?v=__VERSION__"></script>
  <script src="js/tuya-vacuum.js?v=__VERSION__"></script>
  <script src="js/car.js?v=__VERSION__"></script>
  <script src="js/appliances.js?v=__VERSION__"></script>
  <script src="js/appliance-kinds.js?v=__VERSION__"></script>
  <script src="js/media-kinds.js?v=__VERSION__"></script>
  <script src="js/robot-kinds.js?v=__VERSION__"></script>
  <script src="js/cards.js?v=__VERSION__"></script>
  <script src="js/sensors.js?v=__VERSION__"></script>
  <script src="js/charts.js?v=__VERSION__"></script>
  <script src="js/climate.js?v=__VERSION__"></script>
  <script src="js/energy.js?v=__VERSION__"></script>
  <script src="js/energy-kinds.js?v=__VERSION__"></script>
  <script src="js/saver.js?v=__VERSION__"></script>
  <script src="js/sound.js?v=__VERSION__"></script>
  <script src="js/settings.js?v=__VERSION__"></script>
  <script src="js/splash.js?v=__VERSION__"></script>
  <script src="js/update.js?v=__VERSION__"></script>
  <script src="js/main.js?v=__VERSION__"></script>
</body>
</html>
